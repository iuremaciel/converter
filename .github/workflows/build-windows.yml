name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdfa_lote.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.22.2

      - name: Build single-file Windows executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name PDF-A-Lote pdfa_lote.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDF-A-Lote-Windows
          path: dist/PDF-A-Lote.exe
          if-no-files-found: error
          retention-days: 14
